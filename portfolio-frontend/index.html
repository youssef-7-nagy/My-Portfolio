<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/to.png" />
    <link rel="apple-touch-icon" href="/to.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youssef Nagy | Portfolio</title>
    <!-- Instant theme initialization to prevent any theme-switch flash on initial load -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
      })();
    </script>
    <!-- Preload brand logos and ink brush mask so they are decoded before interaction -->
    <link rel="preload" as="image" href="/src/assets/logos/y.png" />
    <link rel="preload" as="image" href="/src/assets/logos/y-white.png" />
    <link rel="preload" as="image" href="/ink-brush-mask.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
